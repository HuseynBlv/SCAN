# Copy to connector.properties and protect it as a secret-bearing file.
# The connector never sends these credentials anywhere except SCAN_API_URL.
SCAN_API_URL=https://scan-demo.onrender.com
SCAN_CONNECTOR_USERNAME=scan-connector
SCAN_CONNECTOR_PASSWORD=replace-with-the-render-ingest-password
SCAN_CONNECTOR_DIRECTORY=scan-data
SCAN_CONNECTOR_POLL_SECONDS=15
SCAN_CONNECTOR_STABLE_SECONDS=10
SCAN_CONNECTOR_TIMEOUT_SECONDS=120
SCAN_CONNECTOR_MAX_RETRY_SECONDS=300
