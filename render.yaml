# The Render service follows the protected production branch after changes are merged.
services:
  - type: web
    name: scan-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: SCAN_RUNTIME_ENVIRONMENT
        value: demo
      - key: SCAN_DATABASE_ID
        value: scan-demo
      - key: SCAN_DB_URL
        sync: false
      - key: SCAN_DB_USERNAME
        sync: false
      - key: SCAN_DB_PASSWORD
        sync: false
      - key: SCAN_ADMIN_PASSWORD
        generateValue: true
      - key: SCAN_ADMIN_USERNAME
        value: scan-demo-admin
      - key: SCAN_CCI_PASSWORD
        generateValue: true
      - key: SCAN_CCI_USERNAME
        value: scan-demo-cci
      - key: SCAN_INGEST_PASSWORD
        generateValue: true
      - key: SCAN_INGEST_USERNAME
        value: scan-demo-connector
      - key: SCAN_RETAILER_PASSWORD
        generateValue: true
      - key: SCAN_RETAILER_USERNAME
        value: scan-demo-retailer
      - key: SCAN_ONBOARDING_PASSWORD
        generateValue: true
      - key: SCAN_ONBOARDING_USERNAME
        value: scan-demo-onboarding
      - key: SCAN_PILOT_RETAILER_CODE
        value: KAGGLE
      - key: SCAN_PILOT_PROFILE_CODE
        value: KAGGLE_2019
  - type: web
    name: scan-caspos-pilot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: SCAN_RUNTIME_ENVIRONMENT
        value: production
      - key: SCAN_DATABASE_ID
        value: scan-production
      - key: SCAN_DB_URL
        sync: false
      - key: SCAN_DB_USERNAME
        sync: false
      - key: SCAN_DB_PASSWORD
        sync: false
      - key: SCAN_ADMIN_PASSWORD
        generateValue: true
      - key: SCAN_ADMIN_USERNAME
        value: scan-caspos-admin
      - key: SCAN_CCI_PASSWORD
        generateValue: true
      - key: SCAN_CCI_USERNAME
        value: scan-caspos-cci
      - key: SCAN_INGEST_PASSWORD
        generateValue: true
      - key: SCAN_INGEST_USERNAME
        value: scan-caspos-connector
      - key: SCAN_RETAILER_PASSWORD
        generateValue: true
      - key: SCAN_RETAILER_USERNAME
        value: scan-caspos-retailer
      - key: SCAN_ONBOARDING_PASSWORD
        generateValue: true
      - key: SCAN_ONBOARDING_USERNAME
        value: scan-caspos-onboarding
      - key: SCAN_PILOT_RETAILER_CODE
        value: CASPOS_PILOT
      - key: SCAN_PILOT_PROFILE_CODE
        value: CLOUDSALE_V1
