# The Render service follows the protected production branch after changes are merged.
services:
  - type: web
    name: scan-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: SCAN_DB_URL
        sync: false
      - key: SCAN_DB_USERNAME
        sync: false
      - key: SCAN_DB_PASSWORD
        sync: false
      - key: SCAN_ADMIN_PASSWORD
        generateValue: true
      - key: SCAN_CCI_PASSWORD
        generateValue: true
      - key: SCAN_INGEST_PASSWORD
        generateValue: true
      - key: SCAN_RETAILER_PASSWORD
        generateValue: true
      - key: SCAN_PILOT_RETAILER_CODE
        value: KAGGLE
      - key: SCAN_PILOT_PROFILE_CODE
        value: KAGGLE_2019
