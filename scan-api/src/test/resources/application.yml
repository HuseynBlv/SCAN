spring:
  datasource:
    url: jdbc:h2:mem:scan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

scan:
  runtime:
    environment: test
    database-id: scan-test
  import-worker:
    initial-delay-ms: 3600000
  security:
    admin-username: test-admin
    admin-password: test-admin-password
    cci-username: test-cci
    cci-password: test-cci-password
    ingest-username: test-connector
    ingest-password: test-connector-password
    retailer-username: test-retailer
    retailer-password: test-retailer-password
    onboarding-username: test-onboarding
    onboarding-password: test-onboarding-password
    bootstrap-enabled: false
  pilot:
    retailer-code: SHARED
    profile-code: CANONICAL
