spring:
  application:
    name: scan-api
  datasource:
    url: ${SCAN_DB_URL:jdbc:postgresql://localhost:5432/scan}
    username: ${SCAN_DB_USERNAME:scan}
    password: ${SCAN_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: never

scan:
  runtime:
    environment: ${SCAN_RUNTIME_ENVIRONMENT:development}
    database-id: ${SCAN_DATABASE_ID:local}
  import-worker:
    poll-delay-ms: ${SCAN_IMPORT_POLL_DELAY_MS:1000}
    initial-delay-ms: ${SCAN_IMPORT_INITIAL_DELAY_MS:1000}
  security:
    admin-username: ${SCAN_ADMIN_USERNAME:scan-admin}
    admin-password: ${SCAN_ADMIN_PASSWORD}
    cci-username: ${SCAN_CCI_USERNAME:scan-cci}
    cci-password: ${SCAN_CCI_PASSWORD}
    ingest-username: ${SCAN_INGEST_USERNAME:scan-connector}
    ingest-password: ${SCAN_INGEST_PASSWORD}
    retailer-username: ${SCAN_RETAILER_USERNAME:scan-retailer}
    retailer-password: ${SCAN_RETAILER_PASSWORD}
    onboarding-username: ${SCAN_ONBOARDING_USERNAME:scan-onboarding}
    onboarding-password: ${SCAN_ONBOARDING_PASSWORD:}
    bootstrap-enabled: ${SCAN_ACCOUNT_BOOTSTRAP_ENABLED:true}
  pilot:
    retailer-code: ${SCAN_PILOT_RETAILER_CODE:DEMO}
    profile-code: ${SCAN_PILOT_PROFILE_CODE:CANONICAL}
