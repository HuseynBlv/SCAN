name: Keep demo warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-demo-warm
  cancel-in-progress: false

jobs:
  ping:
    name: Ping scan-demo health check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request /health with a retry for cold starts
        run: |
          url="https://scan-demo.onrender.com/health"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 60 "$url"; then
              echo
              echo "scan-demo is awake (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "scan-demo did not respond to /health after 3 attempts." >&2
          exit 1
